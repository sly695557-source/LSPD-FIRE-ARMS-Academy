```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LSPD — Officer Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top, #182331 0%, #0b0f14 55%);
        }

        .login-wrapper {
            width: min(440px, 92%);
        }

        .login-card {
            background: #121a23;
            border: 1px solid #354352;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
            text-align: center;
        }

        .login-logo {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 2px solid #c9a227;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c9a227;
            font-size: 20px;
            font-weight: 900;
        }

        .login-card h1 {
            font-size: 23px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .login-card h2 {
            color: #c9a227;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .login-card p {
            color: #929eaa;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .login-card input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            background: #0c1218;
            color: white;
            border: 1px solid #354352;
            border-radius: 6px;
            outline: none;
            text-align: center;
        }

        .login-card input:focus {
            border-color: #c9a227;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            background: #c9a227;
            color: #111;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .login-button:hover {
            background: #e0c34e;
        }

        .error-message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #743d3d;
            background: #251616;
            color: #e07171;
            font-size: 13px;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #929eaa;
            text-decoration: none;
            font-size: 12px;
        }

        .back-link:hover {
            color: #c9a227;
        }

        .login-footer {
            margin-top: 25px;
            color: #67737f;
            font-size: 11px;
        }

        .login-footer strong {
            color: #c9a227;
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-logo">
            LSPD
        </div>

        <h1>LOS SANTOS POLICE DEPARTMENT</h1>

        <h2>FIREARMS DIVISION</h2>

        <p>
            Officer Certification Portal<br>
            Authorized Personnel Only
        </p>

        <form id="officerLoginForm">

            <input
                type="text"
                id="officerName"
                placeholder="Officer Name"
                autocomplete="off"
                required
            >

            <input
                type="password"
                id="officerPassword"
                placeholder="Officer Access Password"
                required
            >

            <button type="submit" class="login-button">
                🔐 ACCESS OFFICER PORTAL
            </button>

        </form>

        <div id="loginError" class="error-message">
            Access Denied — Invalid Officer Credentials
        </div>

        <a href="index.html" class="back-link">
            ← Return to Main Portal
        </a>

        <div class="login-footer">
            Head of Firearms:
            <strong>Henry Fernandez</strong>
        </div>

    </div>

</div>

<script>

document.getElementById("officerLoginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name =
        document.getElementById("officerName").value.trim();

    const password =
        document.getElementById("officerPassword").value;

    /*
     * این بخش فقط برای تست اولیه رابط کاربری است.
     * رمز واقعی را نباید داخل JavaScript عمومی GitHub Pages قرار داد.
     */

    if (name && password) {

        sessionStorage.setItem(
            "officerAuthenticated",
            "true"
        );

        sessionStorage.setItem(
            "officerName",
            name
        );

        window.location.href =
            "index.html#officer-exam";

    } else {

        document.getElementById("loginError").style.display =
            "block";

    }

});

</script>

</body>
</html>
```
