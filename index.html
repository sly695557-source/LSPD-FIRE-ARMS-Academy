<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSPD Academy</title>
</head>

<body>

<h1>LSPD FIREARMS DIVISION</h1>

<p>TEST VERSION</p>

<hr>

<button type="button" onclick="showPage('home')">
    خانه
</button>

<button type="button" onclick="showPage('handbook')">
    Handbook
</button>

<button type="button" onclick="showPage('civilian')">
    Civilian
</button>

<button type="button" onclick="showPage('login')">
    Login
</button>


<div id="home">

    <h2>HOME</h2>

    <p>
        LSPD Firearms Division
    </p>

</div>


<div id="handbook" style="display:none;">

    <h2>HANDBOOK</h2>

    <p>
        Professionalism • Safety • Accountability
    </p>

</div>


<div id="civilian" style="display:none;">

    <h2>CIVILIAN</h2>

    <input
        type="text"
        placeholder="نام متقاضی"
    >

    <br><br>

    <textarea
        placeholder="پاسخ..."
    ></textarea>

</div>


<div id="login" style="display:none;">

    <h2>OFFICER LOGIN</h2>

    <input
        type="email"
        placeholder="Email"
    >

    <br><br>

    <input
        type="password"
        placeholder="Password"
    >

</div>


<script>

function showPage(pageId) {

    document.getElementById("home").style.display = "none";

    document.getElementById("handbook").style.display = "none";

    document.getElementById("civilian").style.display = "none";

    document.getElementById("login").style.display = "none";


    document.getElementById(pageId).style.display = "block";

}

</script>

</body>

</html>
